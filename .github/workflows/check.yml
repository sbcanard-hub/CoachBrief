name: Vérification du projet

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Tester la récupération METAR
        run: python3 scripts/fetch_metar.py

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tester Open-Meteo en conditions réelles
        run: |
          node --input-type=module <<'NODE'
          const date = new Date().toISOString().slice(0, 10)
          const models = ['best_match', 'icon_eu', 'ecmwf_ifs', 'ncep_gfs_global']
          let success = false
          for (const model of models) {
            const params = new URLSearchParams({
              latitude: '43.58', longitude: '7.12',
              hourly: 'temperature_2m,relative_humidity_2m,dew_point_2m,pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
              start_date: date, end_date: date, timezone: 'auto', wind_speed_unit: 'kn', models: model,
            })
            const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`)
            const body = await response.text()
            console.log(model, response.status, body.slice(0, 180))
            if (response.ok) success = true
          }
          if (!success) process.exit(1)
          NODE

      - name: Installer les dépendances
        run: npm ci

      - name: Tester la sortie du chargement météo
        run: node scripts/check_results_loading_guard.mjs

      - name: Vérifier la compilation
        run: npm run build
