name: Vérification du projet

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Tester la récupération METAR
        run: python3 scripts/fetch_metar.py

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Diagnostiquer Open-Meteo au 17 septembre
        run: node scripts/diagnose_openmeteo_20260917.mjs

      - name: Installer les dépendances
        run: npm ci

      - name: Tester la sortie du chargement météo
        run: node scripts/check_results_loading_guard.mjs

      - name: Vérifier la compilation
        run: npm run build
