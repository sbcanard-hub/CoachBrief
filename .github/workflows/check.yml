name: Vérification du projet

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Tester la récupération METAR
        run: python3 scripts/fetch_metar.py

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Diagnostiquer Open-Meteo CoachBrief
        run: |
          node --input-type=module <<'NODE'
          const models = ['best_match','meteofrance_arome_france','ecmwf_ifs','icon_eu','ncep_gfs_global']
          const hourly = 'temperature_2m,relative_humidity_2m,dew_point_2m,pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m'
          for (const model of models) {
            const params = new URLSearchParams({
              latitude: '43.58',
              longitude: '7.12',
              hourly,
              start_date: '2026-09-16',
              end_date: '2026-09-16',
              timezone: 'auto',
              wind_speed_unit: 'kn',
              models: model,
            })
            const url = `https://api.open-meteo.com/v1/forecast?${params}`
            const response = await fetch(url)
            const body = await response.text()
            console.log('\nMODEL', model, 'STATUS', response.status)
            console.log(url)
            console.log(body.slice(0, 1500))
          }
          NODE

      - name: Installer les dépendances
        run: npm ci

      - name: Tester la sortie du chargement météo
        run: node scripts/check_results_loading_guard.mjs

      - name: Vérifier la compilation
        run: npm run build
